# Coronary flow simulation config — baseline (at rest) state.
#
# IMPORTANT: this config assumes the tree CSVs in tree_dir are the AT-REST
# tree (i.e., diameters scaled by `scale_to_rest.jl`). Use tree_dir =
# `VascularTreeSim.jl/output_at_rest/` when invoking.
#
# Physics: arteriolar tone is encoded in the at-rest tree's smaller arteriole
# diameters; we no longer lump it into terminal R. The remaining downstream R
# is the true capillary bed + venous return (Pries-Secomb 2005), ≈ 0.15
# mmHg·min/mL/100g, which is the SAME value as the hyperemic config. State
# difference comes entirely from tree geometry, not the cap-R knob → no
# calibration.
#
# Territory masses come from the XCAT vmale50 KDTree partition (perfusion_pipeline
# step2 output): LAD 58.9 / LCX 60.9 / RCA 63.8 g.
root_pressure_mmhg = 100.0
terminal_pressure_mmhg = 15.0
discharge_hematocrit = 0.45
capillary_bed_R_per_100g_mmHgmin_ml = 0.15
dt = 0.1
t_end = 20.0
max_arrival_s = 15.0
contrast_amplitude = 5.0
contrast_t0 = 0.5
contrast_tmax = 4.0
contrast_alpha = 3.0
contrast_min_diameter_um = 50.0

[territory_masses_g]
LAD = 58.9
LCX = 60.9
RCA = 63.8

[target_flows_ml_min]
LAD = 50.0
LCX = 30.0
RCA = 50.0
