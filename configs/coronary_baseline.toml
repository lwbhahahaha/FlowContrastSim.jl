# Coronary flow simulation config — baseline (at rest) state.
#
# Target flows are the at-rest values: hyperemic flow / 1.6^3 = /4.096.
# Rationale: the XCAT vmale50 phantom encodes at-rest diameters; vessels
# dilate to ~1.6× diameter under maximum hyperemia, which multiplies flow
# by ~1.6^3 = 4.096 (Murray's Q ∝ d^3).
#
# Use coronary_hyperemic.toml instead when simulating a dilated tree.
root_pressure_mmhg = 100.0
terminal_pressure_mmhg = 15.0
discharge_hematocrit = 0.45
dt = 0.1
t_end = 20.0
max_arrival_s = 15.0
contrast_amplitude = 5.0
contrast_t0 = 0.5
contrast_tmax = 4.0
contrast_alpha = 3.0
contrast_min_diameter_um = 50.0   # Skip contrast transport for segments below 50 μm — without this, a 30M-segment tree allocates a 30M×200 concentration matrix (~48 GB per tree)

[target_flows_ml_min]
LAD = 59.08   # 242 / 1.6^3
LCX = 28.32   # 116 / 1.6^3
RCA = 52.25   # 214 / 1.6^3
