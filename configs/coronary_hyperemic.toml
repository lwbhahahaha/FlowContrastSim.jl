# Coronary flow simulation config — hyperemic (max vasodilated) state.
#
# IMPORTANT: this config assumes the tree CSVs in tree_dir are the MAX-DILATED
# tree (i.e., the original Murray-grown tree without arteriolar tone scaling).
# Use tree_dir = `VascularTreeSim.jl/output/` when invoking.
#
# Physics: max vasodilation removes arteriolar tone (arterioles relax to their
# anatomical Murray-optimal diameter). The remaining downstream R is the true
# capillary bed + venous return — Pries-Secomb 2005 in-vivo value ≈ 0.15
# mmHg·min/mL/100g for hyperemic coronary myocardium. Same cap-R value is
# used for the at-rest config; state difference comes from tree geometry.
#
# Territory masses come from the XCAT vmale50 KDTree partition (perfusion_pipeline
# step2 output): LAD 58.9 / LCX 60.9 / RCA 63.8 g.
root_pressure_mmhg = 100.0
terminal_pressure_mmhg = 15.0
discharge_hematocrit = 0.45
# Hyperemic state: cap bed R slightly below the strict Pries-Secomb literature
# value (0.15), modeling residual autoregulatory relaxation of the cap bed +
# venous return during max vasodilation. Combined with the arteriolar dilation
# in the (at-rest → max-dilated) geometry diff (tone 0.4 → 1.67x diameter
# reserve), this brings total CFR to ~4 — Gould-curve midline.
capillary_bed_R_per_100g_mmHgmin_ml = 0.12
dt = 0.1
t_end = 20.0
# max_arrival_s is legacy (was the log-compress target window); now ignored.
# simulate_contrast uses the raw hemo-derived per-segment arrival times.
max_arrival_s = 15.0
contrast_amplitude = 5.0
contrast_t0 = 0.5
contrast_tmax = 4.0
contrast_alpha = 3.0
# Empirical bolus dispersion time scale. disp_factor = sqrt(1 + arrival/t_disp).
# In-vivo coronary measurements give ~1–3 s; 3 s is a conservative default.
# This is empirical (branching + pulsatile flow mixing), not a calibration knob.
contrast_t_dispersion_s = 3.0
contrast_min_diameter_um = 50.0

[territory_masses_g]
LAD = 58.9
LCX = 60.9
RCA = 63.8

[target_flows_ml_min]
LAD = 200.0
LCX = 150.0
RCA = 190.0
