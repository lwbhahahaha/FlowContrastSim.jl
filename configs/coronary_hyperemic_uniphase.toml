# Coronary flow + dynamic contrast — hyperemic state, uniphase injection (no chaser).
#
# This config replaces the legacy hand-tuned (contrast_t0, contrast_tmax,
# contrast_amplitude, contrast_alpha) gamma curve with a physically motivated
# AIF derived from an injection protocol + patient physiology.
#
# Pipeline:
#   protocol (vol/rate/conc) → injection_profile (mgI/s) → ⊛ central transit
#   kernel → ÷ cardiac output → AIF (mgI/mL) → simulate_contrast on each tree.
#
# Override any field below from a Julia script via `with_protocol` or by
# passing kwargs to `run_flow_simulation`. The TOML values are defaults.

# ── Hemodynamics ──
root_pressure_mmhg = 100.0
terminal_pressure_mmhg = 15.0
discharge_hematocrit = 0.45
# Hyperemic state: see configs/coronary_hyperemic.toml for derivation.
capillary_bed_R_per_100g_mmHgmin_ml = 0.12

# ── Time grid for contrast simulation ──
# t_end is generous (60 s) because the uniphase AIF has a long
# recirculation tail and the bolus may take 10–20 s to reach distal
# myocardial segments.
dt = 0.1
t_end = 60.0
contrast_min_diameter_um = 50.0
# Legacy field — only consulted on the no-protocol fallback. When this
# config's [injection_protocol] block is active, simulate_contrast runs
# the Taylor-Aris PDE path which derives per-segment dispersion from
# geometry + flow rather than this scalar.
contrast_t_dispersion_s = 3.0
# Iodine molecular diffusivity (m²/s) used in the Taylor-Aris D_eff term.
# Default 1.5e-9 = iohexol/iomeprol in plasma at 37 °C.
D_mol_m2_s = 1.5e-9

[territory_masses_g]
LAD = 58.9
LCX = 60.9
RCA = 63.8

# Display only — flow is solved physically, not back-calibrated to these.
[target_flows_ml_min]
LAD = 200.0
LCX = 150.0
RCA = 190.0

# ── Contrast injection protocol ──
# Switch protocols by changing `type`. Currently supported: "UniphaseNoChaser".
# All fields below are user-editable per run.
[injection_protocol]
type = "UniphaseNoChaser"
weight_kg = 70.0
contrast_concentration_mgI_ml = 370.0
contrast_volume_per_kg = 0.5
injection_rate_ml_s = 5.0

# ── Patient physiology ──
# Independent of protocol — characterizes the patient's central
# circulation. Defaults are healthy resting adult; literature ranges:
#   cardiac_output_ml_s          50–117    (3–7 L/min)
#   central_transit_delay_s      8–16
#   central_transit_dispersion_s 2–5
[patient_physiology]
cardiac_output_ml_s = 83.0
central_transit_delay_s = 12.0
central_transit_dispersion_s = 3.0
